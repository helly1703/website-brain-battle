<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Brain Battle | Result</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="quiz-body">


    <!-- =====================================
         RESULT PAGE
    ====================================== -->

    <main class="result-wrap">

        <div class="result-card">


            <!-- Trophy -->

            <div class="trophy">
                🏆
            </div>


            <!-- Heading -->

            <h1>
                Quiz Completed!
            </h1>


            <!-- Category -->

            <p id="resultCategory">
                C Programming
            </p>


            <!-- =================================
                 SCORE
            ================================== -->

            <div class="score-circle">

                <span id="score">
                    0/10
                </span>

                <small>
                    Score
                </small>

            </div>


            <!-- Performance -->

            <h2 id="resultMessage">
                Great Job! 🎉
            </h2>


            <!-- Details -->

            <p id="resultDetails">
                You answered 0 correctly out of 10.
            </p>


            <!-- =================================
                 BUTTONS
            ================================== -->

            <div class="result-actions">

                <button
                    class="btn purple"
                    onclick="playAgain()"
                >
                    🔄 Play Again
                </button>


                <button
                    class="btn light"
                    onclick="goHome()"
                >
                    🏠 Home
                </button>

            </div>


        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
